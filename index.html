        // ===================================================================================

        const App = {
            state: { currentLang: 'en', currentStep: 1, areaInputMethod: 'manual', districtData: {}, translations: {}, map: null, drawnItems: null, locationIndicator: null, lastResults: null },
            elements: {},
            helpers: {
                format: (text, params) => {
                    if (typeof text !== 'string') return '';
                    return text.replace(/{(\w+)}/g, (_, key) => params[key] || `{${key}}`);
                }
            },
            logic: {
                saveUserLocation(userId, lat, lon) {
                    if (!userId) return Promise.reject("User not identified.");
                    return db.collection('user_locations').doc(userId).set({
                        lastLocation: { latitude: lat, longitude: lon, timestamp: firebase.firestore.FieldValue.serverTimestamp() }
                    }, { merge: true });
                },
                findClosestDistrict(lat, lon) {
                    let closest = { state: null, district: null, distance: Infinity };
                    const getDistance = (lat1, lon1, lat2, lon2) => {
                        const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
                        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
                        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                    };
                    for (const state in App.state.districtData) {
                        for (const district in App.state.districtData[state]) {
                            const loc = App.state.districtData[state][district];
                            const distance = getDistance(lat, lon, loc.coords[0], loc.coords[1]);
                            if (distance < closest.distance) { closest = { state, district, distance }; }
                        }
                    }
                    return closest;
                }
            },

                 showNotification(message, isError = true) {

                },
                initializeMap() {
                    if (App.state.map) return;

                    App.state.map = L.map('map', { center: [22.5, 82.5], zoom: 5, fullscreenControl: true, fullscreenControlOptions: { position: 'topleft' }, maxBounds: indiaBounds, minZoom: 5 });
                    
                    const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                        attribution: 'Tiles &copy; Esri',

                    const bhuvanSatellite = L.tileLayer('https://bhuvan-vec1.nrsc.gov.in/bhuvan/gwc/service/wmts/rest/bhuvan:satellite_india/{z}/{x}/{y}?format=image/png', {
                        attribution: '&copy; ISRO Bhuvan',
                        maxZoom: 19
                    });

                    const baseMaps = {
                        "ESRI Satellite": esriSatellite,
                        "ISRO Bhuvan": bhuvanSatellite
                    };

                    esriSatellite.addTo(App.state.map);
                    L.control.layers(baseMaps).addTo(App.state.map);
                    
                    const LocateControl = L.Control.extend({
                        options: { position: 'topright' },
                        onAdd: function (map) {
                            const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-custom');
                            container.innerHTML = `<a href="#" title="Detect My Location"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg></a>`;
                            L.DomEvent.on(container, 'click', L.DomEvent.stopPropagation)
                                      .on(container, 'click', L.DomEvent.preventDefault)
                                      .on(container, 'click', () => App.events.handleDetectLocation());
                            return container;
                        }
                    });
                     App.state.map.addControl(new LocateControl());
                    
                    App.state.drawnItems = new L.FeatureGroup();
                    App.state.map.addLayer(App.state.drawnItems);
                    const drawControl = new L.Control.Draw({ position: 'bottomright', edit: { featureGroup: App.state.drawnItems }, draw: { polygon: { shapeOptions: { color: '#3b82f6' }, icon: new L.DivIcon({ iconSize: new L.Point(10, 10), className: 'leaflet-div-icon leaflet-editing-icon' })}, polyline: false, marker: false, circle: false, circlemarker: false, rectangle: false } });
                    App.state.map.addControl(drawControl);
                    
                    App.state.map.on(L.Draw.Event.CREATED, (e) => {
                        App.state.drawnItems.clearLayers(); App.state.drawnItems.addLayer(e.layer);
                        const area = L.GeometryUtil.geodesicArea(e.layer.getLatLngs()[0]);
                        App.elements.rooftopAreaInput.value = area.toFixed(2);
                        e.layer.bindTooltip(`Area: ${area.toFixed(2)} m²`, { permanent: true, direction: 'center', className: 'leaflet-tooltip-permanent' }).openTooltip();
                    });

                    App.state.map.on(L.Draw.Event.EDITED, (e) => {
                        e.layers.eachLayer(layer => {
                            const area = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]);
                            App.elements.rooftopAreaInput.value = area.toFixed(2);
                            if (layer.getTooltip()) {
                                layer.setTooltipContent(`Area: ${area.toFixed(2)} m²`);
                            }
                        });
                    });
                },
                populateStates() {
                    const T = App.state.translations[App.state.currentLang] || {};
                    App.elements.stateSelect.innerHTML = `<option value="" disabled selected>${T['state-placeholder'] || 'Select State...'}</option>`;
                    Object.keys(App.state.districtData).sort().forEach(state => {
                        const option = document.createElement('option'); option.value = state; option.textContent = state;
                        App.elements.stateSelect.appendChild(option);
                    });
                },
                populateDistricts(state) {
                    const T = App.state.translations[App.state.currentLang] || {};
                    App.elements.districtSelect.innerHTML = `<option value="" disabled selected>${T['district-placeholder'] || 'Select District...'}</option>`;
                    App.elements.districtSelect.disabled = true;
                    if (state && App.state.districtData[state]) {
                        Object.keys(App.state.districtData[state]).sort().forEach(district => {
                            const option = document.createElement('option'); option.value = district; option.textContent = district;
                            App.elements.districtSelect.appendChild(option);
                        });
                        App.elements.districtSelect.disabled = false;
                    }
                },
                switchLanguage(lang) {
                    const selectedState = App.elements.stateSelect.value;
                    const selectedDistrict = App.elements.districtSelect.value;
                    
                    App.state.currentLang = lang;
                    const T = App.state.translations[lang] || {};
                    App.elements.langDropdownMenu.querySelectorAll('a').forEach(link => link.classList.toggle('active', link.dataset.lang === lang));
                    
                    Object.keys(T).forEach(key => {
                        const element = document.getElementById(key);
                        if (element && typeof T[key] === 'string' && !T[key].includes('{')) {
                             if (key.endsWith('-placeholder')) { element.placeholder = T[key];
                            } else if (key.endsWith('-btn') || key.endsWith('-cta') || key.endsWith('-text')) { 
                                const span = element.querySelector('span'); 
                                if (span) span.innerHTML = T[key]; 
                                else element.innerHTML = T[key];
                            } else { 
                                if(element.tagName === 'OPTION') { element.textContent = T[key]; } 
                                else { element.innerHTML = T[key]; } 
                            }
                        }
                    });
                    
                    App.ui.populateStates();
                    if(selectedState) {
                        App.elements.stateSelect.value = selectedState;
                        App.ui.populateDistricts(selectedState);
                        if(selectedDistrict) App.elements.districtSelect.value = selectedDistrict;
                    }
                    
                    if (App.state.lastResults) App.ui.renderResults(App.state.lastResults);
                },
                renderResults(results) {
                     const { inputs, data, annualHarvest, daysCovered, recommendation, feasibility, aiSuccessPrediction } = results;
                     const T = App.state.translations[App.state.currentLang] || {};
                     const format = App.helpers.format;

                     const aiCardContainerHTML = `
                        <div class="result-card bg-white p-6 rounded-2xl shadow-md border border-slate-200">
                            <h4 class="text-xl font-bold text-cyan-600 mb-4">${T['ai-title']}</h4>
                            <div class="flex items-center justify-center space-x-4 sm:space-x-6">
                                <div class="relative w-24 h-24 sm:w-32 sm:h-32 flex-shrink-0">
                                    <svg class="w-full h-full" viewBox="0 0 36 36" style="transform: rotate(-90deg);">
                                        <circle class="text-slate-200" stroke-width="3" stroke="currentColor" fill="transparent" r="15.9155" cx="18" cy="18" />
                                        <circle class="text-cyan-500 transition-all duration-1000 ease-out" stroke-width="3" stroke-dasharray="${aiSuccessPrediction || 0}, 100" stroke-linecap="round" stroke="currentColor" fill="transparent" r="15.9155" cx="18" cy="18" />
                                    </svg>
                                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-2xl sm:text-3xl font-bold text-slate-700">${aiSuccessPrediction || 0}<span class="text-lg sm:text-xl">%</span></div>
                                </div>
                                <p class="text-slate-600 flex-1 text-sm sm:text-base">${format(T['ai-subtitle'], {score: aiSuccessPrediction || 0})}</p>
                            </div>
                            <p class="text-xs text-center text-slate-500 mt-4 pt-4 border-t border-slate-200">${T['ai-disclaimer']}</p>
                        </div>`;
                     
                     App.elements.resultsContainer.innerHTML = `
                        <div id="report-content">
                            <div class="result-card bg-white p-6 rounded-2xl shadow-md border border-slate-200"><h4 class="text-xl font-bold text-${feasibility.color}-600 mb-2">${T['feasibility-title']}</h4><p class="text-2xl font-bold text-slate-800">${T[feasibility.ratingKey]}</p><p class="text-slate-600 mt-1">${T[feasibility.textKey]}</p></div>
                            ${aiCardContainerHTML}
                            <div class="result-card bg-white p-6 rounded-2xl shadow-md border border-slate-200 mt-6"><h4 class="text-xl font-bold text-blue-600 mb-2">${T['harvest-title']}</h4><p class="text-4xl font-extrabold text-slate-800">${annualHarvest.toLocaleString(App.state.currentLang.startsWith('en') ? 'en-IN' : `${App.state.currentLang}-IN`)} <span class="text-2xl font-medium text-slate-500">${T['harvest-unit']}</span></p><p class="text-slate-600 mt-2">${format(T['harvest-subtitle'], {area: inputs.rooftopArea})}</p></div>
                            <div class="result-card bg-white p-6 rounded-2xl shadow-md border border-slate-200 mt-6"><h4 class="text-xl font-bold text-green-600 mb-2">${T['impact-title']}</h4><p class="text-2xl font-bold text-slate-800">${format(T['impact-text'], {residents: inputs.residents, days: daysCovered})}</p></div>
                            <div class="grid md:grid-cols-2 gap-6 mt-6">
                                <div class="result-card bg-white p-6 rounded-2xl shadow-md border border-slate-200"><h4 class="text-xl font-bold text-yellow-600 mb-2">${T['structure-title']}</h4><div class="flex items-start space-x-4"><div>${App.ui.getIcon(recommendation.icon)}</div><div><p class="text-2xl font-bold text-slate-800">${T[recommendation.nameKey]}</p><p class="text-slate-600 mt-1">${T[recommendation.descKey]}</p></div></div></div>
                                <div class="result-card bg-white p-6 rounded-2xl shadow-md border border-slate-200"><h4 class="text-xl font-bold text-orange-600 mb-2">${T['dimensions-title']}</h4><p class="text-xl font-bold text-slate-800">${T[recommendation.dimensions.text] || recommendation.dimensions.text}</p>${recommendation.dimensions.area ? `<p class="text-slate-600 mt-1"><span class="font-semibold">${T['dimensions-area']}</span> ${recommendation.dimensions.area} m²</p>` : ''}</div>

                                <div class="result-card bg-white p-6 rounded-2xl shadow-md border border-slate-200"><h4 class="text-xl font-bold text-teal-600 mb-2">${T['data-title']}</h4><ul class="space-y-1 text-slate-700"><li><span class="font-semibold">${T['data-rainfall']}</span> ${data.rainfall} mm</li><li><span class="font-semibold">${T['data-depth']}</span> ~${data.groundwaterDepth} m</li><li><span class="font-semibold">${T['data-aquifer']}</span> ${data.aquifer}</li><li><span class="font-semibold">${T['data-runoff']}</span> ${inputs.runoffCoefficient}</li></ul><p class="text-xs text-slate-500 mt-2">${format(T['data-location'], {district: inputs.district, state: inputs.state})}</p></div>
                            </div>
                        </div>
                        <div id="pdf-container" class="result-card mt-6"><button id="download-pdf-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg text-lg transition-all transform hover:scale-105 flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg><span id="pdf-btn-text">Download Report</span></button></div>
                    `;
                     document.getElementById('pdf-btn-text').textContent = T['pdf-download-btn-text'] || 'Download Report';
                     document.getElementById('download-pdf-btn').addEventListener('click', () => App.events.handlePdfDownload());
                },
                getIcon(name) {
                    const icons = {
                        pit: '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-yellow-500"><path d="M12 22v-6"/><path d="M12 8V2"/><path d="M4 12H2"/><path d="M10 12H8"/><path d="M16 12h-2"/><path d="M22 12h-2"/><path d="m15 15-3 3-3-3"/><path d="M15 9l-3-3-3 3"/></svg>',
                        tank: '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-yellow-500"><path d="M22 11h-2.17l-1-4H5.17l-1 4H2"/><path d="M5 11v11h14V11"/><path d="M8 11v11h2V11"/><path d="M14 11v11h2V11"/><path d="M4.5 9.5a2.5 2.5 0 0 1 0-5h15a2.5 2.5 0 0 1 0 5"/></svg>',
                        borewell: '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-yellow-500"><path d="M14 6h3v3"/><path d="M10.5 10.5 17 4"/><path d="M17 11v6l-5 5-5-5v-6l5-5z"/><path d="m5 15 5-5"/><path d="M9 22v-3h6v3"/></svg>'
                    };
                    return icons[name] || '';
                },
                toggleLoading(isLoading) {
                    const overlay = App.elements.loadingOverlay;
                    if(isLoading) {
                        overlay.style.opacity = '1'; overlay.style.pointerEvents = 'auto';
                    } else {
                        overlay.style.opacity = '0'; overlay.style.pointerEvents = 'none';
                    }
                },
                showResults() { App.elements.placeholder.classList.add('hidden'); App.elements.resultsContainer.classList.remove('hidden'); },
                showPlaceholder() { App.elements.resultsContainer.innerHTML = ''; App.elements.resultsContainer.classList.add('hidden'); App.elements.loader.classList.add('hidden'); App.elements.placeholder.classList.remove('hidden'); },
                updateStepView() {
                    const currentStep = App.state.currentStep;
                    App.elements.steps.forEach(step => step.classList.add('hidden'));
                    document.getElementById(`step-${currentStep}`).classList.remove('hidden');
                    document.querySelectorAll('#progress-bar .step').forEach(stepEl => {
                        const stepNum = parseInt(stepEl.dataset.step);
                        stepEl.classList.toggle('completed', stepNum < currentStep);
                        stepEl.classList.toggle('active', stepNum === currentStep);
                    });
                     document.querySelectorAll('#progress-bar .progress-line').forEach(lineEl => {
                        const lineNum = parseInt(lineEl.dataset.stepLine);
                        lineEl.style.backgroundColor = lineNum < currentStep ? '#22c55e' : '#e2e8f0';
                    });
                }
            },
            events: {
                async handleFormSubmit(e) {
                    e.preventDefault();
                    if(!App.events.validateStep(3)) return;

                    const rooftopAreaValue = parseFloat(App.elements.rooftopAreaInput.value);
                    if (!rooftopAreaValue || rooftopAreaValue <= 0) {
                        App.ui.showNotification("Please set a valid rooftop area before calculating.", true);
                        return;
                    }

                    App.elements.loader.classList.remove('hidden'); App.elements.loader.classList.add('flex');
                    App.elements.placeholder.classList.add('hidden'); App.elements.resultsContainer.classList.add('hidden');
                    
                    const T = App.state.translations[App.state.currentLang] || {};
                    const loaderText = App.elements.loaderText;
                    loaderText.textContent = T['loader-text-connecting'] || "Connecting to server...";
                    const slowLoadTimeout = setTimeout(() => {
                        loaderText.textContent = T['loader-text-waking'] || "Waking up AI server, please wait...";
                    }, 4000);

                    try {
                        const formData = new FormData(App.elements.form);
                        const inputs = {
                            state: formData.get('state'),
                            district: formData.get('district'),
                            rooftopArea: rooftopAreaValue,
                            runoffCoefficient: parseFloat(formData.get('rooftype')),
                            residents: parseInt(formData.get('residents')),
                            openSpace: parseFloat(formData.get('open-space')) || 0,
                            roofTypeText: App.elements.rooftypeSelect.options[App.elements.rooftypeSelect.selectedIndex].text,
                            latitude: App.state.latitude, // NEW: Add latitude
                            longitude: App.state.longitude // NEW: Add longitude
                        };

                        const response = await fetch('https://aquaharvest-backend.onrender.com/analyze', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(inputs)
                        });
                        
                        clearTimeout(slowLoadTimeout);

                        if (!response.ok) {
                            const errorData = await response.json().catch(() => null);
                            const detail = errorData ? errorData.detail : response.statusText;
                            throw new Error(`Backend error: ${response.status} ${detail}`);
                        }

                        const results = await response.json();
                        if (results.error) { throw new Error(results.error); }
                        
                        App.state.lastResults = results;
                        App.ui.renderResults(results); 
                        App.ui.showResults();

                    } catch (error) { 
                        clearTimeout(slowLoadTimeout);
                        console.error("Analysis failed:", error); 
                        App.ui.showNotification(`Analysis failed: ${error.message}. Please check the backend server logs.`); 
                        App.ui.showPlaceholder();
                    } finally { 
                        clearTimeout(slowLoadTimeout);
                        App.elements.loader.classList.add('hidden'); 
                        App.elements.loader.classList.remove('flex'); 
                    }
                },
                handleClearForm() {
                    App.elements.form.reset();
                    if(App.state.drawnItems) App.state.drawnItems.clearLayers();
                    if(App.state.map) App.state.map.setView([22.5, 82.5], 5);
                    if(App.state.locationIndicator) App.state.map.removeLayer(App.state.locationIndicator);
                    App.ui.showPlaceholder(); App.elements.manualOptionBtn.click(); App.ui.populateDistricts('');
                    App.ui.switchLanguage(App.state.currentLang);
                    App.state.currentStep = 1;
                    App.state.latitude = null; // NEW: Reset coordinates
                    App.state.longitude = null; // NEW: Reset coordinates
                    App.ui.updateStepView();
                },
                handleStateChange(e) { 
                    App.ui.populateDistricts(e.target.value); 
                    App.state.latitude = null; // NEW: Reset coordinates on change
                    App.state.longitude = null; // NEW: Reset coordinates on change
                },
                handleDistrictChange(e) {
                    const state = App.elements.stateSelect.value; const district = e.target.value;
                    if (state && district && App.state.districtData[state][district]) {
                        if(App.state.map) App.state.map.setView(App.state.districtData[state][district].coords, 18);
                    }
                    App.state.latitude = null; // NEW: Reset coordinates on change
                    App.state.longitude = null; // NEW: Reset coordinates on change
                },
                handleDetectLocation() {
                    const T = App.state.translations[App.state.currentLang] || {};
                    const btn = App.elements.detectLocationBtn;
                    const originalText = btn.innerHTML;
                    
                    const resetButton = () => {
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    };

                    if (!('geolocation' in navigator)) { App.ui.showNotification(T['geo-unsupported'] || "Geolocation is not supported by your browser."); return; }
                    
                    btn.innerHTML = '<div class="w-4 h-4 border-2 border-blue-400 border-t-transparent rounded-full animate-spin"></div>';
                    btn.disabled = true;
                    
                    navigator.geolocation.getCurrentPosition(
                        async (position) => {
                            const { latitude, longitude } = position.coords;
                            App.state.latitude = latitude; // NEW: Store coordinates
                            App.state.longitude = longitude; // NEW: Store coordinates

                            const currentUser = auth.currentUser;
                            if (currentUser) {
                                App.logic.saveUserLocation(currentUser.uid, latitude, longitude).catch(err => console.error("Firestore Error:", err));
                            }

                            if(App.state.map) {
                                App.state.map.setView([latitude, longitude], 18);
                                if(App.state.locationIndicator) App.state.map.removeLayer(App.state.locationIndicator);
                                App.state.locationIndicator = L.circle([latitude, longitude], { radius: 10, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.75 }).addTo(App.state.map);
                            }

                            // --- NEW: Reverse Geocoding Logic ---
                            try {
                                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=10&addressdetails=1`);
                                if (!response.ok) throw new Error('Reverse geocoding failed');
                                const data = await response.json();
                                
                                const state = data.address.state;
                                // Nominatim sometimes returns 'county' for district.
                                const district = data.address.county || data.address.city_district || data.address.suburb;

                                if (state && district && App.state.districtData[state] && App.state.districtData[state][district]) {
                                    App.elements.stateSelect.value = state;
                                    App.ui.populateDistricts(state);
                                    App.elements.districtSelect.value = district;
                                    App.ui.showNotification("Location detected accurately!", false);
                                } else {
                                    throw new Error("District not found in our database.");
                                }
                            } catch (apiError) {
                                console.warn("Reverse geocoding failed, falling back to closest district:", apiError);
                                const closest = App.logic.findClosestDistrict(latitude, longitude);
                                if (closest) {
                                    App.elements.stateSelect.value = closest.state;
                                    App.ui.populateDistricts(closest.state);
                                    App.elements.districtSelect.value = closest.district;
                                }
                            }
                            // --- END: Reverse Geocoding Logic ---
                            
                            resetButton();
                        },
                        (error) => { 
                            let message;
                            switch (error.code) {
                                case error.PERMISSION_DENIED: message = T['geo-permission-denied'] || "Location access was denied. Please allow it in your browser settings."; break;
                                case error.POSITION_UNAVAILABLE: message = T['geo-position-unavailable'] || "Location information is unavailable. Check network or OS settings."; break;
                                case error.TIMEOUT: message = T['geo-timeout'] || "The request to get user location timed out."; break;
                                default: message = T['geo-unknown-error'] || "An unknown error occurred while detecting location."; break;
                            }
                            App.ui.showNotification(message);
                            resetButton();
                        },
                        { timeout: 10000, enableHighAccuracy: true }
                    );
                },
                handleAreaMethodToggle(method) {
                    App.state.areaInputMethod = method; const isManual = method === 'manual';
                    App.elements.manualOptionBtn.classList.toggle('active', isManual); App.elements.mapOptionBtn.classList.toggle('active', !isManual);
                    App.elements.mapContainer.classList.toggle('hidden', isManual); App.elements.manualAreaContainer.classList.toggle('hidden', !isManual);
                    if (isManual) { App.elements.rooftopAreaInput.value = App.elements.manualRooftopArea.value; } 
                    else { App.elements.rooftopAreaInput.value = ''; setTimeout(() => {if(App.state.map) App.state.map.invalidateSize()}, 10); }
                },
                handleManualAreaInput() { if (App.state.areaInputMethod === 'manual') App.elements.rooftopAreaInput.value = App.elements.manualRooftopArea.value; },
                async handlePdfDownload() {
                    const T = App.state.translations[App.state.currentLang] || App.state.translations['en'];
                    const btn = document.getElementById('download-pdf-btn');
                    const originalHTML = btn.innerHTML;
                    btn.innerHTML = `<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>`;
                    btn.disabled = true;

                    try {
                        const { jsPDF } = window.jspdf;
                        const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });

                        const page_width = doc.internal.pageSize.getWidth();
                        const margin = 15;
                        let y = 0;

                        // Official Header
                        doc.addImage('https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/Emblem_of_India.svg/120px-Emblem_of_India.svg.png', 'PNG', (page_width / 2) - 10, 15, 20, 24);
                        y = 45;
                        doc.setFont('helvetica', 'bold');
                        doc.setFontSize(14);
                        doc.setTextColor('#0c4a6e');
                        doc.text(T['govt-name-text'].toUpperCase(), page_width / 2, y, { align: 'center' });
                        y += 7;
                        doc.setFontSize(12);
                        doc.text(T['ministry-name-text'].toUpperCase(), page_width / 2, y, { align: 'center' });
                        y += 6;
                        doc.setFont('helvetica', 'normal');
                        doc.setFontSize(11);
                        doc.setTextColor('#1e3a8a');
                        doc.text('Central Ground Water Board', page_width / 2, y, { align: 'center' });
                        y += 10;
                        doc.setDrawColor('#9ca3af');
                        doc.setLineWidth(0.5);
                        doc.line(margin, y, page_width - margin, y);
                        y += 12;

                        // Report Title
                        doc.setFontSize(18);
                        doc.setFont('helvetica', 'bold');
                        doc.setTextColor('#111827');
                        doc.text('Rainwater Harvesting Feasibility Report', page_width / 2, y, { align: 'center' });
                        y += 15;

                        // Body Content
                        const reportContentElement = document.getElementById('report-content').cloneNode(true);
                        document.body.appendChild(reportContentElement);
                        
                        // Increase resolution for better quality
                        const canvas = await html2canvas(reportContentElement, { scale: 3, useCORS: true });
                        document.body.removeChild(reportContentElement);
                        
                        const imgData = canvas.toDataURL('image/png');
                        const imgWidth = page_width - (margin * 2);
                        const pageHeight = 297;
                        const imgHeight = canvas.height * imgWidth / canvas.width;
                        let heightLeft = imgHeight;
                        
                        let position = y;
                        
                        doc.addImage(imgData, 'PNG', margin, position, imgWidth, imgHeight);
                        heightLeft -= (pageHeight - y);
                        
                        while (heightLeft >= 0) {
                          position = heightLeft - imgHeight;
                          doc.addPage();
                          doc.addImage(imgData, 'PNG', margin, position, imgWidth, imgHeight);
                          heightLeft -= pageHeight;
                        }

                        doc.save('AquaHarvest-Report.pdf');

                    } catch (error) {
                        console.error("PDF Generation Failed:", error);
                        App.ui.showNotification("Could not generate PDF. Please try again.");
                    } finally {
                        btn.innerHTML = originalHTML;
                        btn.disabled = false;
                    }
                },
                validateStep(stepNum) {
                    const T = App.state.translations[App.state.currentLang] || {};
                    if(stepNum === 1) {
                        if(!App.elements.stateSelect.value) { App.ui.showNotification(T['validation-state'] || "Please select a state."); return false; }
                        if(!App.elements.districtSelect.value) { App.ui.showNotification(T['validation-district'] || "Please select a district."); return false; }
                    } else if (stepNum === 2) {
                         const area = parseFloat(App.elements.rooftopAreaInput.value);
                         if(isNaN(area) || area <= 0) { App.ui.showNotification(T['validation-area'] || "Please enter a valid rooftop area."); return false; }
                    } else if (stepNum === 3) {
                        const residents = parseInt(App.elements.residentsInput.value);
                        if(isNaN(residents) || residents <= 0) { App.ui.showNotification(T['validation-residents'] || "Please enter a valid number of residents."); return false; }
                        const openSpace = App.elements.openSpaceInput.value;
                        if(openSpace === '' || isNaN(parseFloat(openSpace)) || parseFloat(openSpace) < 0) { App.ui.showNotification(T['validation-openspace'] || "Please enter a valid open space area."); return false; }
                    }
                    return true;
                },
                handleStepNavigation(direction) {
                    const currentStep = App.state.currentStep;
                    if(direction === 'next') {
                        if(App.events.validateStep(currentStep)) {
                            if(currentStep < 3) App.state.currentStep++;
                        }
                    } else if(direction === 'prev') {
                        if(currentStep > 1) App.state.currentStep--;
                    }
                    App.ui.updateStepView();
                }
            },
            init() {
                const elementIdMap = {
                    form: 'harvest-form', clearBtn: 'form-clear-btn', stateSelect: 'state-select',
                    districtSelect: 'district-select', rooftopAreaInput: 'rooftop-area',
                    manualRooftopArea: 'manual-rooftop-area', mapContainer: 'map-container',
                    manualAreaContainer: 'manual-area-container', manualOptionBtn: 'manual-option-btn',
                    mapOptionBtn: 'map-option-btn', placeholder: 'placeholder', loader: 'loader',
                    loaderText: 'loader-text', resultsContainer: 'results', detectLocationBtn: 'detect-location-btn',
                    langDropdownBtn: 'lang-dropdown-btn', langDropdownMenu: 'lang-dropdown-menu',
                    langBtnText: 'lang-btn-text',
                    loadingOverlay: 'loading-overlay',
                    rooftypeSelect: 'rooftype-select', residentsInput: 'residents', openSpaceInput: 'open-space',
                    notification: 'notification', notificationMessage: 'notification-message',
                    steps: document.querySelectorAll('.step-content'),
                    nextBtn1: 'next-btn-1', prevBtn2: 'prev-btn-2', nextBtn2: 'next-btn-2', prevBtn3: 'prev-btn-3'
                };
                for (const key in elementIdMap) {
                     if (typeof elementIdMap[key] === 'string') this.elements[key] = document.getElementById(elementIdMap[key]);
                     else this.elements[key] = elementIdMap[key];
                }
                
                this.setupUserSession();
                this.loadInitialData();
            },
            async loadInitialData() {
                try {
                    const [districtResponse, translationResponse] = await Promise.all([ fetch('./data.json'), fetch('./translations.json') ]);
                    if (!districtResponse.ok) throw new Error(`Failed to load data.json (${districtResponse.status})`);
                    if (!translationResponse.ok) throw new Error(`Failed to load translations.json (${translationResponse.status})`);
                    this.state.districtData = await districtResponse.json();
                    this.state.translations = await translationResponse.json();
                    this.ui.switchLanguage('en'); 
                    this.ui.updateStepView();
                    this.setupEventListeners();
                } catch (error) {
                    console.error('Initialization failed:', error);
                    const overlay = this.elements.loadingOverlay;
                    overlay.innerHTML = `<h3 class="text-2xl font-semibold text-red-400">Application Error</h3><p class="text-slate-300 mt-2 text-center px-4">${error.message}. Please check file paths and refresh.</p>`;
                }
            },
            setupUserSession() {
                auth.onAuthStateChanged(user => {
                    if (user) {
                        console.log("DEBUG: User session active. UID:", user.uid);
                        this.ui.toggleLoading(false);
                        this.ui.initializeMap();
                    } else {
                        auth.signInAnonymously().catch(error => {
                            console.error("DEBUG: Anonymous sign-in failed, proceeding without user session:", error);
                            this.ui.toggleLoading(false);
                            this.ui.initializeMap();
                        });
                    }
                });
            },
            setupEventListeners() {
                this.elements.form.addEventListener('submit', (e) => this.events.handleFormSubmit(e));
                this.elements.clearBtn.addEventListener('click', () => this.events.handleClearForm());
                this.elements.stateSelect.addEventListener('change', (e) => this.events.handleStateChange(e));
                this.elements.districtSelect.addEventListener('change', (e) => this.events.handleDistrictChange(e));
                this.elements.detectLocationBtn.addEventListener('click', () => this.events.handleDetectLocation());
                this.elements.manualOptionBtn.addEventListener('click', () => this.events.handleAreaMethodToggle('manual'));
                this.elements.mapOptionBtn.addEventListener('click', () => this.events.handleAreaMethodToggle('map'));
                this.elements.manualRooftopArea.addEventListener('input', () => this.events.handleManualAreaInput());
                this.elements.langDropdownBtn.addEventListener('click', () => this.elements.langDropdownMenu.classList.toggle('hidden'));
                
                this.elements.nextBtn1.addEventListener('click', () => this.events.handleStepNavigation('next'));
                this.elements.prevBtn2.addEventListener('click', () => this.events.handleStepNavigation('prev'));
                this.elements.nextBtn2.addEventListener('click', () => this.events.handleStepNavigation('next'));
                this.elements.prevBtn3.addEventListener('click', () => this.events.handleStepNavigation('prev'));

                document.addEventListener('click', (event) => { 
                    if (this.elements.langDropdownBtn && !this.elements.langDropdownBtn.contains(event.target) && !this.elements.langDropdownMenu.contains(event.target)) {
                        this.elements.langDropdownMenu.classList.add('hidden');
                    }
                });
                this.elements.langDropdownMenu.addEventListener('click', (e) => { 
                    e.preventDefault(); 
                    if (e.target.tagName === 'A') { 
                        this.ui.switchLanguage(e.target.dataset.lang); 
                        this.elements.langDropdownMenu.classList.add('hidden'); 
                    } 
                });
            }
        };

        window.onload = () => App.init();
    </script>

</body>
