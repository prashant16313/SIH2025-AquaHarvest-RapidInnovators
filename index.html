                                    <button type="submit" id="form-submit-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg text-lg flex items-center justify-center shadow-lg shadow-green-600/20"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg><span></span></button>

                    <div id="loader" class="hidden items-center justify-center h-full"><div class="loader"></div><p id="loader-text" class="ml-4 text-lg"></p></div>

    <script>
        // ===================================================================================
        // FIREBASE CONFIGURATION
        // ===================================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBuL_M9UZJdXwjFpZhnf5Rs_rsNEZgTyE0",
            authDomain: "aquaharvest-de350.firebaseapp.com",
            projectId: "aquaharvest-de350",
            storageBucket: "aquaharvest-de350.appspot.com",
            messagingSenderId: "548981197900",
            appId: "1:548981197900:web:1fe433c2f42becd69cf8e9"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===================================================================================
        // AquaHarvest Application
        // ===================================================================================

        const App = {
            state: { currentLang: 'en', currentStep: 1, areaInputMethod: 'manual', districtData: {}, translations: {}, map: null, drawnItems: null, locationIndicator: null, lastResults: null },
            elements: {},
            helpers: {
                format: (text, params) => {
                    if (typeof text !== 'string') return '';
                    return text.replace(/{(\w+)}/g, (_, key) => params[key] || `{${key}}`);
                }
            },
            logic: {
                saveUserLocation(userId, lat, lon) {
                    if (!userId) {
                        console.error("DEBUG: User not identified. Cannot save location.");
                        return Promise.reject("User not identified.");
                    }
                    return db.collection('user_locations').doc(userId).set({
                        lastLocation: {
                            latitude: lat,
                            longitude: lon,
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        }
                    }, { merge: true });
                },
                findClosestDistrict(lat, lon) {
                    let closest = { state: null, district: null, distance: Infinity };
                    const getDistance = (lat1, lon1, lat2, lon2) => {
                        const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
                        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
                        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                    };
                    for (const state in App.state.districtData) {
                        for (const district in App.state.districtData[state]) {
                            const loc = App.state.districtData[state][district];
                            const distance = getDistance(lat, lon, loc.coords[0], loc.coords[1]);
                            if (distance < closest.distance) { closest = { state, district, distance }; }
                        }
                    }
                    return closest;
                }
            },
            ui: {
                showNotification(message, isError = true, element) {
                    if(element) {
                        element.classList.add('border-red-500');
                        setTimeout(() => element.classList.remove('border-red-500'), 3000);
                    }
                    const notification = App.elements.notification;
                    const messageEl = App.elements.notificationMessage;

                    messageEl.textContent = message;
                    notification.classList.remove('bg-red-600', 'bg-green-600');
                    notification.classList.add(isError ? 'bg-red-600' : 'bg-green-600');
                    
                    notification.classList.remove('hidden', 'translate-x-full');
                    
                    setTimeout(() => {
                        notification.classList.add('translate-x-full');
                        setTimeout(() => notification.classList.add('hidden'), 300);
                    }, 5000);
                },
                initializeMap() {
                    if (App.state.map) return;
                    const indiaBounds = L.latLngBounds(L.latLng(5, 68), L.latLng(37, 98));
                    App.state.map = L.map('map', { center: [22.5, 82.5], zoom: 5, fullscreenControl: true, fullscreenControlOptions: { position: 'topleft' }, maxBounds: indiaBounds, minZoom: 5 });
                    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri', maxZoom: 19 });
                    satelliteLayer.addTo(App.state.map);
                    L.control.layers({ "Satellite": satelliteLayer }).addTo(App.state.map);
                    
                    const LocateControl = L.Control.extend({
                        options: { position: 'topright' },
                        onAdd: function (map) {
                            const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-custom');
                            container.innerHTML = `<a href="#" title="Detect My Location"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg></a>`;
                            L.DomEvent.on(container, 'click', L.DomEvent.stopPropagation)
                                      .on(container, 'click', L.DomEvent.preventDefault)
                                      .on(container, 'click', () => App.events.handleDetectLocation());
                            return container;
                        }
                    });
                     App.state.map.addControl(new LocateControl());
                    
                    App.state.drawnItems = new L.FeatureGroup();
                    App.state.map.addLayer(App.state.drawnItems);
                    const drawControl = new L.Control.Draw({ position: 'bottomright', edit: { featureGroup: App.state.drawnItems }, draw: { polygon: { shapeOptions: { color: '#3b82f6' }, icon: new L.DivIcon({ iconSize: new L.Point(10, 10), className: 'leaflet-div-icon leaflet-editing-icon' })}, polyline: false, marker: false, circle: false, circlemarker: false, rectangle: false } });
                    App.state.map.addControl(drawControl);
                    
                    App.state.map.on(L.Draw.Event.CREATED, (e) => {
                        App.state.drawnItems.clearLayers(); App.state.drawnItems.addLayer(e.layer);
                        const area = L.GeometryUtil.geodesicArea(e.layer.getLatLngs()[0]);
                        App.elements.rooftopAreaInput.value = area.toFixed(2);
                        e.layer.bindTooltip(`Area: ${area.toFixed(2)} m²`, { permanent: true, direction: 'center', className: 'leaflet-tooltip-permanent' }).openTooltip();
                    });

                    App.state.map.on(L.Draw.Event.EDITED, (e) => {
                        e.layers.eachLayer(layer => {
                            const area = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]);
                            App.elements.rooftopAreaInput.value = area.toFixed(2);
                            if (layer.getTooltip()) {
                                layer.setTooltipContent(`Area: ${area.toFixed(2)} m²`);
                            }
                        });
                    });

                    App.state.map.on('draw:editvertex', (e) => {
                        if (e.poly) {
                            const polygon = e.poly;
                            const area = L.GeometryUtil.geodesicArea(polygon.getLatLngs()[0]);
                            App.elements.rooftopAreaInput.value = area.toFixed(2);
                            if (polygon.getTooltip()) {
                                polygon.setTooltipContent(`Area: ${area.toFixed(2)} m²`);
                            }
                        }
                    });
                },
                populateStates() {
                    const T = App.state.translations[App.state.currentLang] || {};
                    App.elements.stateSelect.innerHTML = `<option value="" disabled selected>${T['state-placeholder'] || 'Select State...'}</option>`;
                    Object.keys(App.state.districtData).sort().forEach(state => {
                        const option = document.createElement('option'); option.value = state; option.textContent = state;
                        App.elements.stateSelect.appendChild(option);
                    });
                },
                populateDistricts(state) {
                    const T = App.state.translations[App.state.currentLang] || {};
                    App.elements.districtSelect.innerHTML = `<option value="" disabled selected>${T['district-placeholder'] || 'Select District...'}</option>`;
                    App.elements.districtSelect.disabled = true;
                    if (state && App.state.districtData[state]) {
                        Object.keys(App.state.districtData[state]).sort().forEach(district => {
                            const option = document.createElement('option'); option.value = district; option.textContent = district;
                            App.elements.districtSelect.appendChild(option);
                        });
                        App.elements.districtSelect.disabled = false;
                    }
                },
                switchLanguage(lang) {
                    const selectedState = App.elements.stateSelect.value;
                    const selectedDistrict = App.elements.districtSelect.value;
                    
                    App.state.currentLang = lang;
                    const T = App.state.translations[lang] || {};
                    App.elements.selectedLangText.textContent = lang.toUpperCase();
                    App.elements.langDropdownMenu.querySelectorAll('a').forEach(link => link.classList.toggle('active', link.dataset.lang === lang));
                    Object.keys(T).forEach(key => {
                        const element = document.getElementById(key);
                        if (element && typeof T[key] === 'string' && !T[key].includes('{')) {
                             if (key.endsWith('-placeholder')) { element.placeholder = T[key];
                            } else if (key.endsWith('-btn') || key.endsWith('-cta')) { const span = element.querySelector('span'); if (span) span.textContent = T[key]; else element.textContent = T[key];
                            } else { if(element.tagName === 'OPTION') { element.textContent = T[key]; } else { element.innerHTML = T[key]; } }
                        }
                    });
                    App.ui.populateStates();
                    if(selectedState) {
                        App.elements.stateSelect.value = selectedState;
                        App.ui.populateDistricts(selectedState);
                        if(selectedDistrict) {
                             App.elements.districtSelect.value = selectedDistrict;
                        }
                    }
                    
                    if (App.state.lastResults) {
                        App.ui.renderResults(App.state.lastResults);
                    }
                },
                renderResults(results) {
                     const { inputs, data, annualHarvest, daysCovered, recommendation, feasibility, aiSuccessPrediction } = results;
                     const T = App.state.translations[App.state.currentLang] || {};
                     const format = App.helpers.format;

                     // AI Card Translations (can be expanded in translations.json later)
                    const T_AI = {
                        en: {
                            title: "AI Success Prediction",
                            subtitle: `Based on historical data from similar projects, our AI predicts a <strong>{score}% chance of success</strong> for the recommended structure in your location.`
                        },
                        hi: {
                            title: "एआई सफलता भविष्यवाणी",
                            subtitle: `समान परियोजनाओं के ऐतिहासिक आंकड़ों के आधार पर, हमारा एआई आपके स्थान पर अनुशंसित संरचना के लिए <strong>{score}% सफलता की संभावना</strong> की भविष्यवाणी करता है।`
                        },
                        bn: {
                            title: "এআই সাফল্যের পূর্বাভাস",
                            subtitle: "অনুরূপ প্রকল্পগুলি থেকে ঐতিহাসিক তথ্যের ভিত্তিতে, আমাদের এআই আপনার অবস্থানে প্রস্তাবিত কাঠামোর জন্য <strong>{score}% সাফল্যের সম্ভাবনা</strong> পূর্বাভাস দেয়।"
                        },
                        mr: {
                            title: "एआय यश भविष्यवाणी",
                            subtitle: "तत्सम प्रकल्पांच्या ऐतिहासिक डेटावर आधारित, आमचे एआय तुमच्या ठिकाणी शिफारस केलेल्या संरचनेसाठी <strong>{score}% यशाची शक्यता</strong> वर्तवते."
                        },
                        te: {
                            title: "AI సక్సెస్ ప్రిడిక్షన్",
                            subtitle: "ఇలాంటి ప్రాజెక్టుల నుండి చారిత్రక డేటా ఆధారంగా, మా AI మీ ప్రాంతంలో సిఫార్సు చేయబడిన నిర్మాణం కోసం <strong>{score}% విజయం సాధించే అవకాశం</strong> ఉందని అంచనా వేస్తుంది."
                        },
                        ta: {
                            title: "AI வெற்றி கணிப்பு",
                            subtitle: "ஒத்த திட்டங்களின் வரலாற்றுத் தரவுகளின் அடிப்படையில், எங்கள் AI உங்கள் இருப்பிடத்தில் பரிந்துரைக்கப்பட்ட அமைப்புக்கு <strong>{score}% வெற்றி வாய்ப்பை</strong> கணித்துள்ளது."
                        }
                    };
                    const currentT_AI = T_AI[App.state.currentLang] || T_AI.en;


                    const aiCardHTML = `
                        <div class="result-card glassmorphism-card p-6 rounded-2xl">
                            <h4 class="text-xl font-bold text-cyan-300 mb-4">${currentT_AI.title}</h4>
                            <div class="flex items-center justify-center space-x-4 sm:space-x-6">
                                <div class="relative w-24 h-24 sm:w-32 sm:h-32 flex-shrink-0">
                                    <svg class="w-full h-full" viewBox="0 0 36 36" style="transform: rotate(-90deg);">
                                        <circle class="text-slate-600" stroke-width="3" stroke="currentColor" fill="transparent" r="15.9155" cx="18" cy="18" />
                                        <circle class="text-cyan-400 transition-all duration-1000 ease-out"
                                            stroke-width="3"
                                            stroke-dasharray="${aiSuccessPrediction || 0}, 100"
                                            stroke-linecap="round"
                                            stroke="currentColor"
                                            fill="transparent"
                                            r="15.9155" cx="18" cy="18" />
                                    </svg>
                                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-2xl sm:text-3xl font-bold text-white">${aiSuccessPrediction || 0}<span class="text-lg sm:text-xl">%</span></div>
                                </div>
                                <p class="text-slate-300 flex-1 text-sm sm:text-base">${format(currentT_AI.subtitle, {score: aiSuccessPrediction || 0})}</p>
                            </div>
                        </div>
                    `;
                     
                     App.elements.resultsContainer.innerHTML = `
                        <div class="result-card glassmorphism-card p-6 rounded-2xl"><h4 class="text-xl font-bold text-${feasibility.color}-400 mb-2">${T['feasibility-title']}</h4><p class="text-2xl font-bold text-white">${T[feasibility.ratingKey]}</p><p class="text-gray-300 mt-1">${T[feasibility.textKey]}</p></div>
                        ${aiCardHTML}
                        <div class="result-card glassmorphism-card p-6 rounded-2xl"><h4 class="text-xl font-bold text-blue-300 mb-2">${T['harvest-title']}</h4><p class="text-4xl font-extrabold text-white">${annualHarvest.toLocaleString(App.state.currentLang.startsWith('en') ? 'en-IN' : `${App.state.currentLang}-IN`)} ${T['harvest-unit']}</p><p class="text-gray-300 mt-2">${format(T['harvest-subtitle'], {area: inputs.rooftopArea})}</p></div>
                        <div class="result-card glassmorphism-card p-6 rounded-2xl"><h4 class="text-xl font-bold text-green-300 mb-2">${T['impact-title']}</h4><p class="text-2xl font-bold text-white">${format(T['impact-text'], {residents: inputs.residents, days: daysCovered})}</p></div>
                        <div class="grid md:grid-cols-2 gap-6">
                            <div class="result-card glassmorphism-card p-6 rounded-2xl"><h4 class="text-xl font-bold text-yellow-300 mb-2">${T['structure-title']}</h4><div class="flex items-start space-x-4"><div>${App.ui.getIcon(recommendation.icon)}</div><div><p class="text-2xl font-bold text-white">${T[recommendation.nameKey]}</p><p class="text-gray-300 mt-1">${T[recommendation.descKey]}</p></div></div></div>
                            <div class="result-card glassmorphism-card p-6 rounded-2xl"><h4 class="text-xl font-bold text-orange-300 mb-2">${T['dimensions-title']}</h4><p class="text-2xl font-bold text-white">${recommendation.dimensions.text}</p>${recommendation.dimensions.area ? `<p class="text-gray-300 mt-1"><span class="font-semibold">${T['dimensions-area']}</span> ${recommendation.dimensions.area} m²</p>` : ''}</div>
                        </div>
                        <div class="grid md:grid-cols-2 gap-6">
                            <div class="result-card glassmorphism-card p-6 rounded-2xl"><h4 class="text-xl font-bold text-purple-300 mb-2">${T['cost-title']}</h4><p class="text-3xl font-bold text-white">₹ ${recommendation.cost.toLocaleString(App.state.currentLang.startsWith('en') ? 'en-IN' : `${App.state.currentLang}-IN`)}</p><p class="text-gray-300 mt-2">${format(T['cost-subtitle'], {savings: recommendation.annualSavings.toLocaleString(App.state.currentLang.startsWith('en') ? 'en-IN' : `${App.state.currentLang}-IN`)})}</p><p class="text-sm text-gray-400 mt-2 italic">${T['cost-disclaimer']}</p></div>
                            <div class="result-card glassmorphism-card p-6 rounded-2xl"><h4 class="text-xl font-bold text-teal-300 mb-2">${T['data-title']}</h4><p class="text-lg text-white"><span class="font-semibold">${T['data-rainfall']}</span> ${data.rainfall} mm</p><p class="text-lg text-white mt-1"><span class="font-semibold">${T['data-depth']}</span> ~${data.groundwaterDepth} m</p><p class="text-lg text-white mt-1"><span class="font-semibold">${T['data-aquifer']}</span> ${data.aquifer}</p><p class="text-lg text-white mt-1"><span class="font-semibold">${T['data-runoff']}</span> ${inputs.runoffCoefficient}</p><p class="text-sm text-gray-400 mt-2">${format(T['data-location'], {district: inputs.district, state: inputs.state})}</p></div>
                        </div>
                        <div class="result-card mt-6"><button id="download-pdf-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg text-lg transition-all transform hover:scale-105 flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>Download Report as PDF</button></div>
                    `;
                     document.getElementById('download-pdf-btn').addEventListener('click', () => App.events.handlePdfDownload());
                },
                getIcon(name) {
                    const icons = {
                        pit: '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-yellow-300"><path d="M12 22v-6"/><path d="M12 8V2"/><path d="M4 12H2"/><path d="M10 12H8"/><path d="M16 12h-2"/><path d="M22 12h-2"/><path d="m15 15-3 3-3-3"/><path d="M15 9l-3-3-3 3"/></svg>',
                        tank: '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-yellow-300"><path d="M22 11h-2.17l-1-4H5.17l-1 4H2"/><path d="M5 11v11h14V11"/><path d="M8 11v11h2V11"/><path d="M14 11v11h2V11"/><path d="M4.5 9.5a2.5 2.5 0 0 1 0-5h15a2.5 2.5 0 0 1 0 5"/></svg>',
                        borewell: '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-yellow-300"><path d="M14 6h3v3"/><path d="M10.5 10.5 17 4"/><path d="M17 11v6l-5 5-5-5v-6l5-5z"/><path d="m5 15 5-5"/><path d="M9 22v-3h6v3"/></svg>'
                    };
                    return icons[name] || '';
                },
                toggleLoading(isLoading) {
                    const overlay = App.elements.loadingOverlay;
                    if(isLoading) {
                        overlay.style.opacity = '1'; overlay.style.pointerEvents = 'auto';
                    } else {
                        overlay.style.opacity = '0'; overlay.style.pointerEvents = 'none';
                    }
                },
                showResults() { App.elements.placeholder.classList.add('hidden'); App.elements.resultsContainer.classList.remove('hidden'); },
                showPlaceholder() { App.elements.resultsContainer.innerHTML = ''; App.elements.resultsContainer.classList.add('hidden'); App.elements.loader.classList.add('hidden'); App.elements.placeholder.classList.remove('hidden'); },
                updateStepView() {
                    const currentStep = App.state.currentStep;
                    App.elements.steps.forEach(step => step.classList.add('hidden'));
                    document.getElementById(`step-${currentStep}`).classList.remove('hidden');
                    document.querySelectorAll('#progress-bar .step').forEach(stepEl => {
                        const stepNum = parseInt(stepEl.dataset.step);
                        stepEl.classList.toggle('completed', stepNum < currentStep);
                        stepEl.classList.toggle('active', stepNum === currentStep);
                    });
                     document.querySelectorAll('#progress-bar .progress-line').forEach(lineEl => {
                        const lineNum = parseInt(lineEl.dataset.stepLine);
                        lineEl.style.backgroundColor = lineNum < currentStep ? '#16a34a' : '#475569';
                    });

                }
            },
            events: {
                async handleFormSubmit(e) {
                    e.preventDefault();
                    if(!App.events.validateStep(3)) return;

                    const rooftopAreaValue = parseFloat(App.elements.rooftopAreaInput.value);
                    if (!rooftopAreaValue || rooftopAreaValue <= 0) {
                        App.ui.showNotification("Please set a valid rooftop area before calculating.", true);
                        return;
                    }

                    App.elements.loader.classList.remove('hidden'); App.elements.loader.classList.add('flex');
                    App.elements.placeholder.classList.add('hidden'); App.elements.resultsContainer.classList.add('hidden');
                    
                    try {
                        const formData = new FormData(App.elements.form);
                        const inputs = {
                            state: formData.get('state'),
                            district: formData.get('district'),
                            rooftopArea: rooftopAreaValue,
                            runoffCoefficient: parseFloat(formData.get('rooftype')),
                            residents: parseInt(formData.get('residents')),
                            openSpace: parseFloat(formData.get('open-space')) || 0,
                            roofTypeText: App.elements.rooftypeSelect.options[App.elements.rooftypeSelect.selectedIndex].text
                        };

                        const response = await fetch('http://127.0.0.1:8000/analyze', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(inputs)
                        });

                        if (!response.ok) {
                            const errorData = await response.json().catch(() => null);
                            const detail = errorData ? errorData.detail : response.statusText;
                            throw new Error(`Backend error: ${response.status} ${detail}`);
                        }

                        const results = await response.json();
                        if (results.error) {
                            throw new Error(results.error);
                        }
                        
                        App.state.lastResults = results;
                        App.ui.renderResults(results); 
                        App.ui.showResults();

                    } catch (error) { 
                        console.error("Analysis failed:", error); 
                        App.ui.showNotification(`Analysis failed: ${error.message}. Please check the backend server logs.`); 
                        App.ui.showPlaceholder();
                    } finally { 
                        App.elements.loader.classList.add('hidden'); 
                        App.elements.loader.classList.remove('flex'); 
                    }
                },
                handleClearForm() {
                    App.elements.form.reset();
                    if(App.state.drawnItems) App.state.drawnItems.clearLayers();
                    if(App.state.map) App.state.map.setView([22.5, 82.5], 5);
                    if(App.state.locationIndicator) App.state.map.removeLayer(App.state.locationIndicator);
                    App.ui.showPlaceholder(); App.elements.manualOptionBtn.click(); App.ui.populateDistricts('');
                    App.ui.switchLanguage(App.state.currentLang);
                    App.state.currentStep = 1;
                    App.ui.updateStepView();
                },
                handleStateChange(e) { App.ui.populateDistricts(e.target.value); },
                handleDistrictChange(e) {
                    const state = App.elements.stateSelect.value; const district = e.target.value;
                    if (state && district && App.state.districtData[state][district]) {
                        if(App.state.map) App.state.map.setView(App.state.districtData[state][district].coords, 18);
                    }
                },
                handleDetectLocation() {
                    const btn = App.elements.detectLocationBtn;
                    const resetButton = () => {
                        const originalText = App.state.translations[App.state.currentLang]['auto-location-text'] || 'Auto-select Location';
                        btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg><span>${originalText}</span>`;
                        btn.disabled = false;
                    };

                    if (!('geolocation' in navigator)) { App.ui.showNotification("Geolocation is not supported by your browser."); return; }
                    
                    btn.innerHTML = '<div class="w-4 h-4 border-2 border-blue-400 border-t-transparent rounded-full animate-spin"></div>';
                    btn.disabled = true;
                    
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const { latitude, longitude } = position.coords;
                            const currentUser = auth.currentUser;
                            if (currentUser) {
                                App.logic.saveUserLocation(currentUser.uid, latitude, longitude)
                                    .catch(error => { 
                                        console.error("FIRESTORE ERROR: Could not save location.", error); 
                                        App.ui.showNotification("Could not save location.");
                                    });
                            } else {
                                App.ui.showNotification("User session not ready. Please try again.");
                            }

                            if(App.state.map) {
                                App.state.map.setView([latitude, longitude], 18);
                                if(App.state.locationIndicator) App.state.map.removeLayer(App.state.locationIndicator);
                                App.state.locationIndicator = L.circle([latitude, longitude], { radius: 10, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.75 }).addTo(App.state.map);
                            }
                            const closest = App.logic.findClosestDistrict(latitude, longitude);
                            if (closest) {
                                App.elements.stateSelect.value = closest.state;
                                App.ui.populateDistricts(closest.state);
                                App.elements.districtSelect.value = closest.district;
                            }
                            resetButton();
                        },
                        (error) => { 
                            let message = `Error: ${error.message}.`;
                            if (window.isSecureContext === false) { message += " Location access requires a secure (HTTPS) connection."; } 
                            else { message += " Please enable location services in your browser/OS."; }
                            App.ui.showNotification(message);
                            resetButton();
                        },
                        { timeout: 10000, enableHighAccuracy: true }
                    );
                },
                handleAreaMethodToggle(method) {
                    App.state.areaInputMethod = method; const isManual = method === 'manual';
                    App.elements.manualOptionBtn.classList.toggle('active', isManual); App.elements.mapOptionBtn.classList.toggle('active', !isManual);
                    App.elements.mapContainer.classList.toggle('hidden', isManual); App.elements.manualAreaContainer.classList.toggle('hidden', !isManual);
                    if (isManual) { App.elements.rooftopAreaInput.value = App.elements.manualRooftopArea.value; } 
                    else { App.elements.rooftopAreaInput.value = ''; setTimeout(() => {if(App.state.map) App.state.map.invalidateSize()}, 10); }
                },
                handleManualAreaInput() { if (App.state.areaInputMethod === 'manual') App.elements.rooftopAreaInput.value = App.elements.manualRooftopArea.value; },
                handlePdfDownload() {
                    const results = App.state.lastResults;
                    if (!results) { App.ui.showNotification('Please analyze data first to generate a report.'); return; }
                    const { jsPDF } = window.jspdf; const doc = new jsPDF('p', 'mm', 'a4');
                    const { inputs, data, annualHarvest, daysCovered, recommendation, feasibility } = results;
                    const T = App.state.translations['en'] || {}; const format = App.helpers.format;
                    let y = 15; const page_width = doc.internal.pageSize.getWidth();
                    const col1 = 20; const col2 = 80;
                    function addText(text, x, yPos, size, style, color = '#000000', align) { doc.setFontSize(size); doc.setFont('helvetica', style); doc.setTextColor(color); doc.text(text, x, yPos, { align: align || 'left' }); }
                    function addSection(title, yPos) { doc.setFillColor(236, 242, 255); doc.rect(15, yPos - 5, page_width - 30, 8, 'F'); addText(title, 20, yPos, 12, 'bold', '#0c4a6e'); return yPos + 10; }
                    addText('AquaHarvest Report', page_width / 2, y, 22, 'bold', '#1e3a8a', 'center'); y += 15; doc.setDrawColor(200); doc.line(15, y, page_width - 15, y); y += 10;
                    y = addSection(T['form-title'] || 'Project Inputs', y);
                    addText(`Location: ${inputs.district}, ${inputs.state}`, col1, y, 11, 'normal'); addText(`Rooftop Area: ${inputs.rooftopArea} m²`, page_width - 20, y, 11, 'normal', null, 'right'); y += 7;
                    addText(`Roof Type: ${inputs.roofTypeText}`, col1, y, 11, 'normal'); y += 7; addText(`Number of Residents: ${inputs.residents}`, col1, y, 11, 'normal'); addText(`Available Open Space: ${inputs.openSpace} m²`, page_width - 20, y, 11, 'normal', null, 'right'); y += 15;
                    y = addSection('Key Results Summary', y);
                    addText('Feasibility Check:', col1, y, 11, 'bold'); addText(T[feasibility.ratingKey], col2, y, 11, 'bold', feasibility.color === 'green' ? '#16a34a' : (feasibility.color === 'yellow' ? '#f59e0b' : '#ef4444')); y += 7;
                    addText('Estimated Water Harvested:', col1, y, 11, 'bold'); addText(`${annualHarvest.toLocaleString('en-IN')} ${T['harvest-unit']}`, col2, y, 11, 'bold', '#2563eb'); y += 7;
                    addText('Water-Saving Impact:', col1, y, 11, 'bold'); let impactText = format(T['impact-text'], {residents: inputs.residents, days: daysCovered}).replace(/<[^>]*>?/gm, ''); doc.text(doc.splitTextToSize(impactText, page_width - col2 - 15), col2, y); y += 15;
                    y = addSection('Detailed Analysis', y);
                    addText('Recommended Structure', col1, y, 11, 'bold'); addText(T[recommendation.nameKey], col2, y, 11, 'normal'); y += 6; doc.text(doc.splitTextToSize(T[recommendation.descKey], page_width - col2 - 15), col2, y); y += 15;
                    addText('Recommended Dimensions', col1, y, 11, 'bold'); addText(recommendation.dimensions.text, col2, y, 11, 'normal'); y += 10;
                    addText('Cost & Benefit Analysis', col1, y, 11, 'bold'); y += 8; addText('Estimated Project Cost:', col1 + 5, y, 11, 'normal'); addText(`Rs. ${recommendation.cost.toLocaleString('en-IN')}`, page_width - 20, y, 11, 'bold', '#374151', 'right'); y += 7; addText('Estimated Annual Savings:', col1 + 5, y, 11, 'normal'); addText(`Rs. ${recommendation.annualSavings.toLocaleString('en-IN')}`, page_width - 20, y, 11, 'bold', '#16a34a', 'right'); y += 12; 
                    y = addSection('Local Data Used', y);
                    addText(T['data-rainfall'], col1, y, 11, 'bold'); addText(`${data.rainfall} mm`, col2, y, 11, 'normal'); y += 7; addText(T['data-depth'], col1, y, 11, 'bold'); addText(`~${data.groundwaterDepth} m`, col2, y, 11, 'normal'); y += 7; addText(T['data-aquifer'], col1, y, 11, 'bold'); addText(data.aquifer, col2, y, 11, 'normal'); y += 7;
                    addText(T['data-runoff'] || 'Runoff Coefficient:', col1, y, 11, 'bold'); addText(`${inputs.runoffCoefficient}`, col2, y, 11, 'normal');
                    doc.save('AquaHarvest-Report.pdf');
                },
                validateStep(stepNum) {
                    const T = App.state.translations[App.state.currentLang] || {};
                    if(stepNum === 1) {
                        if(!App.elements.stateSelect.value) {
                            App.ui.showNotification(T['validation-state'] || "Please select a state.", true, App.elements.stateSelect);
                            return false;
                        }
                        if(!App.elements.districtSelect.value) {
                            App.ui.showNotification(T['validation-district'] || "Please select a district.", true, App.elements.districtSelect);
                            return false;
                        }
                    } else if (stepNum === 2) {
                         const area = parseFloat(App.elements.rooftopAreaInput.value);
                         if(isNaN(area) || area <= 0) {
                            App.ui.showNotification(T['validation-area'] || "Please enter a valid rooftop area.", true, App.state.areaInputMethod === 'manual' ? App.elements.manualRooftopArea : App.elements.mapContainer);
                            return false;
                         }
                    } else if (stepNum === 3) {
                        const residents = parseInt(App.elements.residentsInput.value);
                        if(isNaN(residents) || residents <= 0) {
                             App.ui.showNotification(T['validation-residents'] || "Please enter a valid number of residents.", true, App.elements.residentsInput);
                            return false;
                        }
                        const openSpace = App.elements.openSpaceInput.value;
                        if(openSpace === '' || isNaN(parseFloat(openSpace)) || parseFloat(openSpace) < 0) {
                            App.ui.showNotification(T['validation-openspace'] || "Please enter a valid open space area.", true, App.elements.openSpaceInput);
                            return false;
                        }
                    }
                    return true;
                },
                handleStepNavigation(direction) {
                    const currentStep = App.state.currentStep;
                    if(direction === 'next') {
                        if(App.events.validateStep(currentStep)) {
                            if(currentStep < 3) App.state.currentStep++;
                        }
                    } else if(direction === 'prev') {
                        if(currentStep > 1) App.state.currentStep--;
                    }
                    App.ui.updateStepView();
                }
            },
            init() {
                const elementIdMap = {
                    form: 'harvest-form', clearBtn: 'form-clear-btn', stateSelect: 'state-select',
                    districtSelect: 'district-select', rooftopAreaInput: 'rooftop-area',
                    manualRooftopArea: 'manual-rooftop-area', mapContainer: 'map-container',
                    manualAreaContainer: 'manual-area-container', manualOptionBtn: 'manual-option-btn',
                    mapOptionBtn: 'map-option-btn', placeholder: 'placeholder', loader: 'loader',
                    loaderText: 'loader-text', resultsContainer: 'results', detectLocationBtn: 'detect-location-btn',
                    langDropdownBtn: 'lang-dropdown-btn', langDropdownMenu: 'lang-dropdown-menu',
                    selectedLangText: 'selected-lang-text', loadingOverlay: 'loading-overlay',
                    rooftypeSelect: 'rooftype-select', residentsInput: 'residents', openSpaceInput: 'open-space',
                    notification: 'notification', notificationMessage: 'notification-message',
                    steps: document.querySelectorAll('.step-content'),
                    nextBtn1: 'next-btn-1', prevBtn2: 'prev-btn-2', nextBtn2: 'next-btn-2', prevBtn3: 'prev-btn-3',
                };
                for (const key in elementIdMap) {
                     if (typeof elementIdMap[key] === 'string') this.elements[key] = document.getElementById(elementIdMap[key]);
                     else this.elements[key] = elementIdMap[key];
                }
                
                this.setupUserSession();
                this.loadInitialData();
            },
            async loadInitialData() {
                try {
                    const [districtResponse, translationResponse] = await Promise.all([ fetch('./data.json'), fetch('./translations.json') ]);
                    if (!districtResponse.ok) throw new Error(`Failed to load data.json (${districtResponse.status})`);
                    if (!translationResponse.ok) throw new Error(`Failed to load translations.json (${translationResponse.status})`);
                    this.state.districtData = await districtResponse.json();
                    this.state.translations = await translationResponse.json();
                    this.ui.switchLanguage('en'); 
                    this.ui.updateStepView();
                    this.setupEventListeners();
                } catch (error) {
                    console.error('Initialization failed:', error);
                    const overlay = this.elements.loadingOverlay;
                    overlay.innerHTML = `<h3 class="text-2xl font-semibold text-red-400">Application Error</h3><p class="text-slate-300 mt-2 text-center px-4">${error.message}. Please check file paths and refresh.</p>`;
                }
            },
            setupUserSession() {
                auth.onAuthStateChanged(user => {
                    if (user) {
                        console.log("DEBUG: User session active. UID:", user.uid);
                        this.ui.toggleLoading(false);
                        this.ui.initializeMap();
                    } else {
                        auth.signInAnonymously().catch(error => {
                            console.error("DEBUG: Anonymous sign-in failed, proceeding without user session:", error);
                            this.ui.toggleLoading(false);
                            this.ui.initializeMap();
                        });
                    }
                });
            },
            setupEventListeners() {
                this.elements.form.addEventListener('submit', (e) => this.events.handleFormSubmit(e));
                this.elements.clearBtn.addEventListener('click', () => this.events.handleClearForm());
                this.elements.stateSelect.addEventListener('change', (e) => this.events.handleStateChange(e));
                this.elements.districtSelect.addEventListener('change', (e) => this.events.handleDistrictChange(e));
                this.elements.detectLocationBtn.addEventListener('click', () => this.events.handleDetectLocation());
                this.elements.manualOptionBtn.addEventListener('click', () => this.events.handleAreaMethodToggle('manual'));
                this.elements.mapOptionBtn.addEventListener('click', () => this.events.handleAreaMethodToggle('map'));
                this.elements.manualRooftopArea.addEventListener('input', () => this.events.handleManualAreaInput());
                this.elements.langDropdownBtn.addEventListener('click', () => this.elements.langDropdownMenu.classList.toggle('hidden'));
                
                // Step Navigation
                this.elements.nextBtn1.addEventListener('click', () => this.events.handleStepNavigation('next'));
                this.elements.prevBtn2.addEventListener('click', () => this.events.handleStepNavigation('prev'));
                this.elements.nextBtn2.addEventListener('click', () => this.events.handleStepNavigation('next'));
                this.elements.prevBtn3.addEventListener('click', () => this.events.handleStepNavigation('prev'));

                document.addEventListener('click', (event) => { 
                    if (this.elements.langDropdownBtn && !this.elements.langDropdownBtn.contains(event.target) && !this.elements.langDropdownMenu.contains(event.target)) {
                        this.elements.langDropdownMenu.classList.add('hidden');
                    }
                });
                this.elements.langDropdownMenu.addEventListener('click', (e) => { 
                    e.preventDefault(); 
                    if (e.target.tagName === 'A') { 
                        this.ui.switchLanguage(e.target.dataset.lang); 
                        this.elements.langDropdownMenu.classList.add('hidden'); 
                    } 
                });
            }
        };

        window.onload = () => App.init();
    </script>

</body>
</html>
